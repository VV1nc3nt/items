syntax = "proto3";

package items;

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/VV1nc3nt/items/internal/pb/items;items";

service ItemService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message Item {
  int64 id = 1;
  string category = 2;
  string title = 3;
  string description = 4;
  string image_key = 5;
  int64 price = 6;
  int32 quantity = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateRequest {
  string category = 1 [(buf.validate.field).string.min_len = 1];
  string title = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string description = 3;
  string image_key = 4;
  int64 price = 5 [(buf.validate.field).int64.gte = 0];
  int32 quantity = 6 [(buf.validate.field).int32.gte = 0];
}

message CreateResponse {
  Item item = 1;
}

message GetRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetResponse {
  Item item = 1;
}

message ListRequest {
  optional string category = 1;
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  int32 pointer = 3[(buf.validate.field).int32.gte = 0];
}

message ListResponse {
    repeated Item item = 1;
}

message UpdateRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string category = 2 [(buf.validate.field).string.min_len = 1];
  optional string title = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 4;
  optional string image_key = 5;
  optional int64 price = 6 [(buf.validate.field).int64.gte = 0];
  optional int32 quantity = 7 [(buf.validate.field).int32.gte = 0];
}

message UpdateResponse {
  Item item = 1;
}

message DeleteRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteResponse {
  Item item = 1;
}