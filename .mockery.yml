all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/VV1nc3nt/items/internal/handler/create:
    config:
      all: true
      dir: "./internal/handler/create/mocks"
      filename: 'Mock{{.InterfaceName}}.go'
      pkgname: "createmock"
  github.com/VV1nc3nt/items/internal/service/item_manager:
    config:
      all: true
      dir: "./internal/service/item_manager/mocks"
      filename: 'Mock{{.InterfaceName}}.go'
      pkgname: "itemmanagermock"
